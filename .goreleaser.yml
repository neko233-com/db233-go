# GoReleaser 配置文件
# 用于自动化发布流程
version: 2

# 构建配置
builds:
  - skip: true  # db233-go 是库，不需要构建二进制

# 归档配置
archives:
  - formats: [tar.gz]
    meta: true
    files:
      # 可独立审阅/构建的源码归档；Go 用户仍应优先使用 module proxy。
      - pkg/**
      - LICENSE
      - README.md
      - CHANGELOG*.md
      - go.mod
      - go.sum
      - version.txt
      - config.local.json.example
      - config.local.yaml.example
      - docs/**
      # 排除示例代码和所有层级测试
      - "!examples/**"
      - "!tests/**"
      - "!**/*_test.go"

# 发布配置
release:
  github:
    owner: neko233-com
    name: db233-go

  # 发布说明
  header: |
    ## DB233-Go {{.Tag}}
    
    感谢使用 db233-go！

  footer: |
    ## 安装方式
    
    ```bash
    go get github.com/neko233-com/db233-go@{{.Tag}}
    ```
    
    ## 文档
    
    - [项目文档](https://github.com/neko233-com/db233-go/blob/{{ .Tag }}/README.md)
    - [架构概览](https://github.com/neko233-com/db233-go/blob/{{ .Tag }}/docs/OVERVIEW.md)
    - [Schema 迁移](https://github.com/neko233-com/db233-go/blob/{{ .Tag }}/docs/SCHEMA_MIGRATION.md)

# 变更日志
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^examples:'
